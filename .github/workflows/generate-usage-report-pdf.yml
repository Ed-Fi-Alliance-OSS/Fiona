name: Generate Usage Report PDF

on:
  # Runs a few hours before WeeklyReportTrigger's REPORT_SCHEDULE (Mondays
  # 9am UTC per deploy-usage-report-function.yml), so the PDF and that
  # week's KPI Slack text describe the same Mon-Sun window. Keep this ahead
  # of REPORT_SCHEDULE if that schedule ever changes.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

env:
  AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT || 'fionausagereportsa' }}
  AZURE_STORAGE_CONTAINER: usage-reports

permissions:
  contents: read

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/usage-report-function
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/usage-report-function/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          creds: ${{ secrets.USAGE_REPORT_PDF_CREDENTIALS }}

      - name: Export service principal credentials for the Cosmos SDK
        # DefaultAzureCredential (used by generate-executive-report-artifact.js
        # to read Cosmos DB) picks these up via EnvironmentCredential.
        # azure/login authenticates the az CLI session above but does not
        # export these itself.
        run: |
          echo "AZURE_CLIENT_ID=$(echo '${{ secrets.USAGE_REPORT_PDF_CREDENTIALS }}' | jq -r .clientId)" >> "$GITHUB_ENV"
          echo "AZURE_CLIENT_SECRET=$(echo '${{ secrets.USAGE_REPORT_PDF_CREDENTIALS }}' | jq -r .clientSecret)" >> "$GITHUB_ENV"
          echo "AZURE_TENANT_ID=$(echo '${{ secrets.USAGE_REPORT_PDF_CREDENTIALS }}' | jq -r .tenantId)" >> "$GITHUB_ENV"

      - name: Generate executive report PDF
        env:
          COSMOS_ENDPOINT: ${{ secrets.COSMOS_ENDPOINT }}
          COSMOS_DATABASE: chatbot
          COSMOS_INTERACTIONS_CONTAINER: interactions
          COSMOS_FEEDBACK_CONTAINER: feedback
          DEPLOYMENT_TYPE: production
        run: node scripts/generate-executive-report-artifact.js

      - name: Upload PDF to Blob Storage
        run: |
          PDF_FILE_NAME=$(jq -r .pdfFileName reports/report-meta.json)
          az storage blob upload \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --container-name "$AZURE_STORAGE_CONTAINER" \
            --name "$PDF_FILE_NAME" \
            --file "reports/$PDF_FILE_NAME" \
            --auth-mode login \
            --overwrite

      - name: Generate SAS URL and write latest-link.json pointer
        run: |
          PDF_FILE_NAME=$(jq -r .pdfFileName reports/report-meta.json)
          WEEK_START=$(jq -r .weekStart reports/report-meta.json)
          WEEK_END=$(jq -r .weekEnd reports/report-meta.json)
          DEPLOYMENT_TYPE_VALUE=$(jq -r .deploymentType reports/report-meta.json)

          EXPIRY=$(date -u -d '+90 days' '+%Y-%m-%dT%H:%MZ')
          SAS_TOKEN=$(az storage blob generate-sas \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --container-name "$AZURE_STORAGE_CONTAINER" \
            --name "$PDF_FILE_NAME" \
            --permissions r \
            --expiry "$EXPIRY" \
            --auth-mode login \
            --as-user \
            --output tsv)
          BLOB_URL="https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/${AZURE_STORAGE_CONTAINER}/${PDF_FILE_NAME}?${SAS_TOKEN}"

          jq -n \
            --arg url "$BLOB_URL" \
            --arg weekStart "$WEEK_START" \
            --arg weekEnd "$WEEK_END" \
            --arg deploymentType "$DEPLOYMENT_TYPE_VALUE" \
            '{url: $url, weekStart: $weekStart, weekEnd: $weekEnd, deploymentType: $deploymentType}' \
            > reports/latest-link.json

          az storage blob upload \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --container-name "$AZURE_STORAGE_CONTAINER" \
            --name latest-link.json \
            --file reports/latest-link.json \
            --auth-mode login \
            --overwrite

name: Post-Mortem Synthesis

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC

permissions:
  contents: read

jobs:
  synthesize:
    name: Open synthesis issue for Copilot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout postmortem-data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: postmortem-data
          fetch-depth: 1
        continue-on-error: true

      - name: Open synthesis issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_ASSIGNEE: ${{ vars.COPILOT_ASSIGNEE }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          records=(docs/postmortems/PR-*.json)
          COUNT=${#records[@]}
          if [ "${COUNT}" -eq 0 ]; then
            echo "No un-processed post-mortem records; nothing to synthesize."
            exit 0
          fi
          BODY=$(cat <<EOF
          Consolidate the ${COUNT} un-processed post-mortem record(s) on the
          \`postmortem-data\` branch (\`docs/postmortems/PR-*.json\`) into one
          improvement PR.

          Follow \`.github/instructions/postmortem.instructions.md\`. Open a
          single human-gated PR editing the coding-agent steering files; put
          ticket-description suggestions in the PR body as prose; include an
          AI-use disclosure; move consumed records to
          \`docs/postmortems/processed/\`.

          Use the post-mortem synthesis persona
          (\`.github/agents/postmortem-synthesis.agent.md\`); the analysis
          policy \`.github/instructions/postmortem.instructions.md\` applies
          (it is path-scoped to \`docs/postmortems/**\`).
          EOF
          )
          ISSUE_URL=$(gh issue create --repo "${REPO}" \
            --title "Post-mortem synthesis $(date +%F)" \
            --body "${BODY}")
          echo "Opened ${ISSUE_URL}"
          if [ -n "${COPILOT_ASSIGNEE:-}" ]; then
            ISSUE_ID=$(gh issue view "${ISSUE_URL}" --json id -q .id)
            ACTOR_ID=$(gh api graphql -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){suggestedActors(capabilities:[CAN_BE_ASSIGNED],first:100){nodes{login __typename ... on Bot{id}}}}}' -f o="${REPO%/*}" -f n="${REPO#*/}" --jq ".data.repository.suggestedActors.nodes[] | select(.login==\"${COPILOT_ASSIGNEE}\") | .id")
            if [ -n "${ACTOR_ID}" ]; then
              gh api graphql -f query='mutation($a:ID!,$b:ID!){replaceActorsForAssignable(input:{assignableId:$a,actorIds:[$b]}){clientMutationId}}' -f a="${ISSUE_ID}" -f b="${ACTOR_ID}"
              echo "Assigned ${COPILOT_ASSIGNEE} to ${ISSUE_URL}"
            else
              echo "::warning::COPILOT_ASSIGNEE='${COPILOT_ASSIGNEE}' is not in the repo's assignable actors; issue left unassigned for a human to route."
            fi
          fi

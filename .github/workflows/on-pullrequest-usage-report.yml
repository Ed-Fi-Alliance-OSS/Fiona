name: Build and Test the Usage Report Function App

on:
  # This is not running on `push: main` because `deploy-usage-report-function.yml` is triggered
  # on this push, and it calls back to this test workflow
  pull_request:
    paths:
      - 'apps/usage-report-function/**'
      - '.github/workflows/deploy-usage-report-function.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/usage-report-function
    permissions:
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/usage-report-function/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

      - name: Report test results
        uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5 # v1.9.1
        if: always()
        with:
          name: Jest Tests - usage-report-function
          path: apps/usage-report-function/junit.xml
          reporter: jest-junit
          fail-on-error: false

      - name: Report code coverage
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "## Code Coverage - usage-report-function" >> $GITHUB_STEP_SUMMARY
            echo "Coverage report not available (tests may have failed before coverage was collected)." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "## Code Coverage - usage-report-function" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const t = data.total;
            console.log('| Statements | ' + t.statements.pct + '% |');
            console.log('| Branches | ' + t.branches.pct + '% |');
            console.log('| Functions | ' + t.functions.pct + '% |');
            console.log('| Lines | ' + t.lines.pct + '% |');
          " >> $GITHUB_STEP_SUMMARY

  code_analysis:
    name: Code Analysis (CodeQL & Dependency Review)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/usage-report-function
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Dependency Review
        # dependency-review-action requires PR/merge-group context (base/head refs)
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || github.event_name == 'merge_group' }}
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

      - name: Setup Node (from .nvmrc)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/usage-report-function/package-lock.json

      - name: Install dependencies (ci)
        run: npm ci

      - name: Initialize CodeQL
        uses: github/codeql-action/init@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
